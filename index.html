<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#070707" />
<title>Gear Up Store | إكسسوارات سيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Oswald:wght@600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070707;
    --surface: #141414;
    --line: #2c2c2c;
    --fg: #f4f1ea;
    --muted: #a39e96;
    --red: #e10600;
    --ink: #fff7f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Cairo, Tahoma, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.45; }
  button, a { font: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  [hidden] { display: none !important; }
  img { display: block; max-width: 100%; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 100vh; }
  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: rgba(7,7,7,.94);
    border-bottom: 1px solid var(--line);
  }
  .mark {
    background: var(--red); color: var(--ink);
    font-family: Oswald, Cairo, sans-serif; letter-spacing: .04em;
    padding: 7px 12px; clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  }
  .top small { display: block; color: var(--muted); font-size: 12px; }
  .wrap { width: min(860px, 100%); margin: 0 auto; padding: 16px 16px 88px; }
  .hero {
    border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; margin-bottom: 12px;
    background: radial-gradient(circle at 100% 0%, rgba(225,6,0,.32), transparent 42%), var(--surface);
  }
  .hero h1 { font-family: Oswald, Cairo, sans-serif; font-size: clamp(30px, 8vw, 52px); line-height: 1.05; }
  .hero h1 span { color: var(--red); }
  .hero p { color: var(--muted); margin-top: 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
  .chip { flex: 0 0 auto; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 8px 14px; font-weight: 800; }
  .chip.on { background: var(--red); color: var(--ink); border-color: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .shot { aspect-ratio: 4 / 3; background: #1b1b1b; }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .plate { height: 100%; display: grid; place-items: center; text-align: center; padding: 10px; background: linear-gradient(160deg, rgba(225,6,0,.2), transparent 45%), #1b1b1b; }
  .plate b { display: block; font-family: Oswald, Cairo, sans-serif; font-size: 22px; }
  .plate span { color: var(--muted); font-size: 12px; }
  .body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .car { color: var(--red); font-size: 12px; font-weight: 800; }
  .body h2 { font-size: 16px; line-height: 1.35; }
  .price { font-size: 18px; font-weight: 800; margin-top: auto; }
  .price span, .muted { color: var(--muted); font-size: 12px; font-weight: 700; }
  .add { margin-top: 8px; min-height: 44px; border: 0; border-radius: 12px; background: var(--red); color: var(--ink); font-weight: 800; }
  .side {
    position: sticky; top: 0; height: 100vh;
    background: #101010; border-inline-start: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 15;
  }
  .side-head, .side-foot { padding: 14px; border-bottom: 1px solid var(--line); }
  .side-foot { border-bottom: 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .side-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  .count { min-width: 28px; height: 28px; border-radius: 999px; background: var(--red); color: var(--ink); display: grid; place-items: center; font-size: 13px; }
  .lines { flex: 1; overflow: auto; padding: 8px 14px; }
  .line { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #1b1b1b; }
  .qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qty button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .total { display: flex; justify-content: space-between; font-weight: 800; }
  .done, .go { min-height: 48px; border: 0; border-radius: 12px; background: var(--red); color: var(--ink); font-weight: 800; }
  .empty { color: var(--muted); padding: 16px 0; }
  .x { display: none; min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .sheet {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.62);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet.open { display: flex; }
  .box {
    width: min(480px, 100%); background: var(--bg); border: 1px solid var(--line);
    border-radius: 18px 18px 0 0; padding: 16px; display: grid; gap: 8px;
  }
  .box h2 { font-size: 18px; }
  .box label { display: grid; gap: 4px; font-size: 13px; font-weight: 800; }
  .box input, .box textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 12px; padding: 12px; font: inherit;
  }
  .box textarea { min-height: 72px; resize: vertical; }
  .err { color: #ffb4a8; font-size: 13px; min-height: 1.2em; }
  .wa {
    position: fixed; z-index: 25; inset-inline-start: 14px; bottom: 14px;
    width: 52px; height: 52px; border-radius: 50%; background: #128c3e; color: white;
    display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.4);
  }
  .toast {
    position: fixed; z-index: 60; inset-inline-start: 16px; bottom: 76px;
    background: var(--fg); color: var(--bg); font-weight: 800; border-radius: 12px; padding: 12px 14px; display: none;
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 14px; }
    .hero { padding: 28px; }
  }
  .short { display: none; }
  @media (max-width: 799px) {
    .app { display: block; }
    .wrap { padding-inline-end: 112px; padding-bottom: 24px; }
    .grid { grid-template-columns: 1fr; }
    .long { display: none; }
    .short { display: inline; }
    .side {
      position: fixed;
      top: 74px;
      bottom: 16px;
      inset-inline-end: 8px;
      width: 96px;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      align-items: center;
      padding-top: 8px;
    }
    .lines, .total, .side-head strong { display: none; }
    .side-head, .side-foot { border: 0; padding: 8px; width: 100%; }
    .side-foot { margin-top: auto; }
    .done { min-height: 48px; }
    .side.open {
      top: 0; bottom: 0; inset-inline-end: 0; width: min(100%, 380px);
      height: 100vh; border-radius: 0; align-items: stretch;
    }
    .side.open .long { display: inline; }
    .side.open .short { display: none; }
    .side.open .lines, .side.open .total, .side.open .side-head strong, .side.open .x { display: block; }
    .side.open .side-head { display: flex; }
  }
  .gear {
    margin-inline-start: auto;
    width: 44px; height: 44px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    display: grid; place-items: center;
  }
  .admin {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72);
    display: none; align-items: flex-end; justify-content: center;
  }
  .admin.open { display: flex; }
  .panel {
    width: min(560px, 100%); max-height: 92vh; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 16px;
  }
  .panel h2 { margin-bottom: 8px; }
  .panel label { display: grid; gap: 4px; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
  .panel input, .panel textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 12px; padding: 12px; font: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .edit { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .ghost { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0; }
  @media (min-width: 800px) { .admin { align-items: center; } .panel { border-radius: 18px; } }
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app">
  <div class="shop">
    <header class="top">
      <div class="mark">GEAR UP</div>
      <div><strong>STORE</strong><small>إكسسوارات سيارات</small></div>
      <button class="gear" id="openAdmin" type="button" aria-label="لوحة التحكم">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <main class="wrap">
      <section class="hero">
        <h1>CAR<br><span>ACCESSORIES</span></h1>
        <p>ضيف كل القطع للسلة. الاسم والعنوان في الآخر مرة واحدة.</p>
      </section>
      <div class="chips" id="chips"></div>
      <p class="note" id="catalogStatus" role="status">جاري تحميل المنتجات…</p>
      <section class="grid" id="grid"></section>
    </main>
  </div>
  <aside class="side" id="side">
    <div class="side-head">
      <strong>السلة</strong>
      <span class="count" id="count">0</span>
      <button class="x" id="closeSide" type="button">إغلاق</button>
    </div>
    <div class="lines" id="lines"></div>
    <div class="side-foot">
      <div class="total"><span>الإجمالي</span><span id="total">0 ج.م</span></div>
      <button class="done" id="toCheckout" type="button"><span class="long">إتمام الطلب</span><span class="short">إتمام</span></button>
    </div>
  </aside>
</div>
<div class="sheet" id="sheet">
  <form class="box" id="pay">
    <h2>بيانات التوصيل</h2>
    <p class="muted" id="summary"></p>
    <label>الاسم<input name="name" autocomplete="name" required></label>
    <label>رقم الهاتف<input name="phone" inputmode="tel" autocomplete="tel" required></label>
    <label>العنوان<textarea name="address" required></textarea></label>
    <p class="err" id="err"></p>
    <button class="go" type="submit">إرسال الطلب على واتساب</button>
    <button type="button" id="cancelPay" style="min-height:44px;border:1px solid #2c2c2c;border-radius:12px;background:#141414;color:#f4f1ea">رجوع للسلة</button>
  </form>
</div>
<a class="wa" href="https://wa.me/201119592645" target="_blank" rel="noopener" aria-label="واتساب الدعم">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11.5A8.5 8.5 0 0 1 6.7 18.8L4 20l1.3-2.6A8.5 8.5 0 1 1 20 11.5z"/></svg>
</a>
<div class="admin" id="admin">
  <div class="panel">
    <form id="pinForm">
      <h2>لوحة التحكم</h2>
      <label>كلمة المرور<input id="pinInput" type="password" autocomplete="current-password" required></label>
      <p class="err" id="pinErr"></p>
      <button class="go" type="submit">دخول</button>
      <button class="ghost" id="closeAdmin" type="button" style="width:100%;margin-top:8px">إغلاق</button>
    </form>
    <div id="dash" hidden>
      <h2>المنتجات</h2>
      <p class="note" id="saveMsg" role="status" aria-live="polite">عدّل المنتجات، وبعدها اضغط حفظ ونشر علشان تظهر لكل الزوار.</p>
      <button class="ghost" id="recoverLegacy" type="button" hidden>استرجاع منتجات الجهاز القديمة</button>
      <button class="ghost" id="exportDraft" type="button">تنزيل نسخة من المسودة</button>
      <button class="ghost" id="refreshCatalog" type="button">تحميل أحدث نسخة منشورة</button>
      <div id="edits"></div>
      <button class="go" id="savePublic" type="button" style="width:100%">حفظ ونشر</button>
      <button class="go" id="addItem" type="button" style="width:100%;margin-top:8px">إضافة منتج</button>
      <button class="ghost" id="logout" type="button" style="width:100%;margin-top:8px">تسجيل خروج</button>
      <button class="ghost" id="closeDash" type="button" style="width:100%;margin-top:8px">إغلاق</button>
    </div>
  </div>
</div>
<script src="/assets/store.js" defer></script>
<script src="/assets/admin.js" defer></script>
</body>
</html>
